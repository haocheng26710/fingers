[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acoustic-ladder"
version = "0.1.0"
description = "Auditable V1.3 model-package ingestion and provisional device manifest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "pydantic>=2.12,<3",
  "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
acoustic-ladder-model = "acoustic_ladder.model_package.cli:main"
acoustic-ladder = "acoustic_ladder.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acoustic_ladder"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
